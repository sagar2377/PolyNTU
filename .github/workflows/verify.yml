name: Verify Rust outcome markets
on: [push, pull_request]
jobs:
  # Path-scoped verification: each job below runs only when the commit could
  # have affected it. Backend/trading changes gate the Rust checks and the
  # performance job; frontend changes gate the frontend build; the browser
  # end-to-end job runs on any backend, frontend, or test-script change;
  # anything else (docs, other scripts) skips all of them.
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect changed areas
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          # First push of a branch, force push, or missing base: verify everything.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "e2e=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          backend=false
          frontend=false
          e2e=false
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FILES=$(git diff --name-only "$BASE...$GITHUB_SHA")
          else
            FILES=$(git diff --name-only "$BASE" "$GITHUB_SHA")
          fi
          while IFS= read -r file; do
            case "$file" in
              backend|backend/*|scripts/benchmark-kpi.mjs|.github/workflows/verify.yml) backend=true; e2e=true ;;
              frontend|frontend/*) frontend=true; e2e=true ;;
              scripts/browser-e2e.mjs) e2e=true ;;
            esac
          done <<< "$FILES"
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "e2e=$e2e" >> "$GITHUB_OUTPUT"

  verify:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: polyntu
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U polyntu -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://polyntu:test-only-password@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        if: needs.changes.outputs.frontend == 'true'
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
        if: needs.changes.outputs.backend == 'true'
      - run: rustup override set stable
        if: needs.changes.outputs.backend == 'true'
      # Must run after the toolchain is selected so the cache key reflects the
      # Rust version that actually builds. `workspaces` takes the workspace
      # root directory, not a Cargo.toml path: the action passes the value as
      # the cwd of `cargo metadata`, and a file path fails with spawn ENOTDIR.
      - uses: Swatinem/rust-cache@v2
        if: needs.changes.outputs.backend == 'true'
        with:
          workspaces: backend
      - run: cargo fmt --manifest-path backend/Cargo.toml -- --check
        if: needs.changes.outputs.backend == 'true'
      - run: cargo test --manifest-path backend/Cargo.toml --locked -- --test-threads=4
        if: needs.changes.outputs.backend == 'true'
      - run: cargo clippy --manifest-path backend/Cargo.toml --all-targets --locked -- -D warnings
        if: needs.changes.outputs.backend == 'true'
      - run: npm ci && npm run lint && npm run build
        if: needs.changes.outputs.frontend == 'true'
        working-directory: frontend

  performance:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: polyntu
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U polyntu -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://polyntu:test-only-password@localhost:5432/postgres
      POLYNTU_QUOTE_SECRET: ci-only-quote-secret-0123456789abcdef
      POLYNTU_ADMIN_TOKEN: ci-only-admin-token-0123456789abcdef
      POLYNTU_DEMO_MODE: "false"
      POLYNTU_BIND: 127.0.0.1:18000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: rustup toolchain install stable --profile minimal
      - run: rustup override set stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - run: cargo build --manifest-path backend/Cargo.toml --release --locked
      - name: Run throughput KPI benchmark
        run: |
          ./backend/target/release/polyntu > server.log 2>&1 &
          SERVER=$!
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:18000/health >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:18000/health >/dev/null || { cat server.log >&2; exit 1; }
          # The runner shell uses -e; disable it around the benchmark so the
          # server is killed and the exit status is propagated, not skipped.
          set +e
          BENCH_URL=http://127.0.0.1:18000 BENCH_SECONDS=15 BENCH_REPORT=kpi-report.json node scripts/benchmark-kpi.mjs
          STATUS=$?
          set -e
          kill $SERVER 2>/dev/null || true
          exit $STATUS
      - name: Retain KPI report and server log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: kpi-regression-report
          path: |
            kpi-report.json
            server.log

  # Drives the real React UI in headless Chrome over the DevTools protocol:
  # registration with password-derived resolution keys, creator verification,
  # publishing, trading, charts, and both resolution paths. Demo mode is
  # required for the seeded administrator and the clock advance.
  browser-e2e:
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: polyntu
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U polyntu -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://polyntu:test-only-password@localhost:5432/postgres
      POLYNTU_QUOTE_SECRET: ci-only-quote-secret-0123456789abcdef
      POLYNTU_ADMIN_TOKEN: ci-only-admin-token-0123456789abcdef
      POLYNTU_DEMO_MODE: "true"
      POLYNTU_BIND: 127.0.0.1:8000
      POLYNTU_FRONTEND_DIR: frontend/dist
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: rustup toolchain install stable --profile minimal
      - run: rustup override set stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - run: cargo build --manifest-path backend/Cargo.toml --release --locked
      - run: npm ci && npm run build
        working-directory: frontend
      - name: Start headless Chrome with a debug port
        run: |
          google-chrome --headless=new --remote-debugging-port=9223 \
            --user-data-dir="$RUNNER_TEMP/chrome-e2e-profile" --no-sandbox \
            --disable-gpu --disable-dev-shm-usage --no-first-run about:blank &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:9223/json/version >/dev/null && exit 0
            sleep 1
          done
          echo "Chrome debug endpoint never became ready" >&2
          exit 1
      - name: Run the browser end-to-end flow
        run: |
          ./backend/target/release/polyntu > server.log 2>&1 &
          SERVER=$!
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8000/health >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/health >/dev/null || { cat server.log >&2; exit 1; }
          # The runner shell uses -e; disable it around the test so the server
          # is killed and the exit status is propagated, not skipped.
          set +e
          node scripts/browser-e2e.mjs
          STATUS=$?
          set -e
          kill $SERVER 2>/dev/null || true
          exit $STATUS
      - name: Retain server log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-e2e-server-log
          path: server.log
