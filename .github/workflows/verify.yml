name: Verify Rust outcome markets
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: polyntu
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U polyntu -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://polyntu:test-only-password@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: rustup toolchain install 1.88.0 --profile minimal --component rustfmt --component clippy
      - run: rustup override set 1.88.0
      # Must run after the toolchain is selected so the cache key reflects the
      # Rust version that actually builds. `workspaces` takes the workspace
      # root directory, not a Cargo.toml path: the action passes the value as
      # the cwd of `cargo metadata`, and a file path fails with spawn ENOTDIR.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - run: cargo fmt --manifest-path backend/Cargo.toml -- --check
      - run: cargo test --manifest-path backend/Cargo.toml --locked -- --test-threads=4
      - run: cargo clippy --manifest-path backend/Cargo.toml --all-targets --locked -- -D warnings
      - run: npm ci && npm run lint && npm run build
        working-directory: frontend

  performance:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: polyntu
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U polyntu -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://polyntu:test-only-password@localhost:5432/postgres
      POLYNTU_QUOTE_SECRET: ci-only-quote-secret-0123456789abcdef
      POLYNTU_ADMIN_TOKEN: ci-only-admin-token-0123456789abcdef
      POLYNTU_DEMO_MODE: "false"
      POLYNTU_BIND: 127.0.0.1:18000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: rustup toolchain install 1.88.0 --profile minimal
      - run: rustup override set 1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - run: cargo build --manifest-path backend/Cargo.toml --release --locked
      - name: Run throughput KPI benchmark
        run: |
          ./backend/target/release/polyntu > server.log 2>&1 &
          SERVER=$!
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:18000/health >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:18000/health >/dev/null || { cat server.log >&2; exit 1; }
          # The runner shell uses -e; disable it around the benchmark so the
          # server is killed and the exit status is propagated, not skipped.
          set +e
          BENCH_URL=http://127.0.0.1:18000 BENCH_SECONDS=15 BENCH_REPORT=kpi-report.json node scripts/benchmark-kpi.mjs
          STATUS=$?
          set -e
          kill $SERVER 2>/dev/null || true
          exit $STATUS
      - name: Retain KPI report and server log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: kpi-regression-report
          path: |
            kpi-report.json
            server.log
