services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: polyntu
      POSTGRES_DB: polyntu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a database password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polyntu -d polyntu"]
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgres://polyntu:${POSTGRES_PASSWORD}@db/polyntu
      POLYNTU_QUOTE_SECRET: ${POLYNTU_QUOTE_SECRET:?Set a persistent random quote secret}
      POLYNTU_ADMIN_TOKEN: ${POLYNTU_ADMIN_TOKEN:?Set a different random administrator token}
      POLYNTU_DEMO_MODE: "false"
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres-data:
